[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minebot-sdk"
version = "0.2.0"
description = "Python client for controlling MineBot robots over websocket."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websocket-client>=1.8,<2"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
